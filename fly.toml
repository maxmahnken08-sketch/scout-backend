# Fly.io config. Deploy with: fly launch --copy-config --now  (then `fly secrets set KEY=...`)
app = "scout-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  SCOUT_MODEL = "claude-haiku-4-5"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
